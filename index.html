<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14243d"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mein Budget"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Mein Budget</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css?v=6.0.0"><script defer src="core.js?v=6.0.0"></script><script defer src="app.js?v=6.0.0"></script>
</head>
<body>
<div id="error" class="fatal" hidden role="alert"></div>
<header><div class="top"><div><small>DEIN FINANZÜBERBLICK</small><h1>Mein Budget<span>6</span></h1></div><button id="settings" class="settings" aria-label="Einstellungen">⚙</button></div>
<div class="period"><button id="prev" aria-label="Voriger Budgetmonat">‹</button><button id="period" aria-label="Budgetmonat wählen"></button><button id="next" aria-label="Nächster Budgetmonat">›</button></div>
<button id="update" class="update" hidden>Update verfügbar · Jetzt aktualisieren</button></header>
<main id="main"></main>
<button id="add" class="fab" aria-label="Eintrag hinzufügen">+</button>
<nav aria-label="Hauptnavigation"><button data-tab="home">▦<span>Cockpit</span></button><button data-tab="income">＋<span>Einnahmen</span></button><button data-tab="fixed">⌂<span>Fixkosten</span></button><button data-tab="expenses">−<span>Ausgaben</span></button></nav>
<dialog id="dialog"><div id="modal"></div></dialog>
<section id="lock" hidden><form id="unlock"><h2>🔒 Mein Budget</h2><p>Lokale Bildschirmsperre</p><label>PIN<input id="unlockPin" type="password" inputmode="numeric" required maxlength="8"></label><button class="primary">Entsperren</button><p id="pinError" role="alert"></p></form></section>
<div id="toast" role="status"></div><div id="print"></div>
<noscript><p>Bitte JavaScript aktivieren, damit deine Budget-App funktioniert.</p></noscript>
</body></html>
